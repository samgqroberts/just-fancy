[package]
name = "just-fancy"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.17"
console = "0.15"
petgraph = { version = "0.6", default-features = false }
strip-ansi-escapes = "0.2"
anyhow = "1"
num_cpus = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
